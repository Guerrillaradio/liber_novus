

---
layout: default
---

<style>
  body {
    background-color: #000000;
    color: #00ff00;
    font-family: monospace;
    text-align: center;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  input, button {
    background-color: #000000;
    color: #00ff00;
    border: 1px solid #00ff00;
    font-family: monospace;
    margin: 6px auto;
    text-align: center;
  }

  input::placeholder {
    color: #00ff00;
    opacity: 0.6;
  }

  button:hover {
    background-color: #00ff00;
    color: #000000;
  }

  .hint {
    color: #00ff00;
    opacity: 0.8;
    font-size: 0.9em;
  }

  #image {
    display: block;
    margin: 20px auto;
    max-width: 400px;
  }
</style>

<h1> class="cursor">¿Qué lugar es?</h1>

<p>Puntos: <span id="score">0</span></p>

<div id="game">
  <img id="image" src="" alt="imagen">

  <div>
    <input id="continent" placeholder="continente">
  </div>
  <div>
    <input id="country" placeholder="país">
  </div>

  <p class="hint">Si no sabes, escribe: <strong>desconocido</strong></p>

  <button onclick="checkAnswer()">responder</button>
</div>

<p id="feedback"></p>

<script src="game.js"></script>
