


<style>
  body {
    background-color: #000000;
    color: #00ff00;
    font-family: monospace;
    text-align: center;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  input, button {
    background-color: #000000;
    color: #00ff00;
    border: 1px solid #00ff00;
    font-family: monospace;
    margin: 6px auto;
    text-align: center;
  }

  input::placeholder {
    color: #00ff00;
    opacity: 0.6;
  }

  button:hover {
    background-color: #00ff00;
    color: #000000;
  }

  .hint {
    color: #00ff00;
    opacity: 0.8;
    font-size: 0.9em;
  }

  #image {
    display: block;
    margin: 20px auto;
    max-width: 400px;
  }

  /* CURSOR TIPO TERMINAL (BLOQUE) — TÍTULO */
  #terminal-cursor {
    display: inline-block;
    margin-left: 6px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%   { opacity: 1; }
    50%  { opacity: 0; }
    100% { opacity: 1; }
  }

  /* ===== CURSOR TIPO TERMINAL DENTRO DEL INPUT ===== */

  /* Ocultar caret real */
  input:focus {
    caret-color: transparent;
  }

  /* Dibujar cursor tipo bloque dentro del input */
  input:focus {
    background-image: linear-gradient(#00ff00, #00ff00);
    background-repeat: no-repeat;
    background-size: 0.6em 1.2em;
    background-position: 0.6em center;
    animation: input-blink 1s steps(1) infinite;
  }

  @keyframes input-blink {
    0%   { background-image: linear-gradient(#00ff00, #00ff00); }
    50%  { background-image: none; }
    100% { background-image: linear-gradient(#00ff00, #00ff00); }
  }
</style>

<h1>¿Qué lugar es?<span id="terminal-cursor">█</span></h1>

<p>Puntos: <span id="score">0</span></p>

<div id="game">
  <img id="image" src="" alt="imagen">

  <div>
    <input id="continent" placeholder="continente">
  </div>

  <div>
    <input id="country" placeholder="país">
  </div>

  <p class="hint">
    Si no sabes, escribe: <strong>desconocido</strong>
  </p>

  <button onclick="checkAnswer()">responder</button>
</div>

<p id="feedback"></p>

<script src="game.js"></script>

<!-- SCRIPT PARA MOVER EL CURSOR DEL TÍTULO AL INPUT ACTIVO -->
<script>
  const cursor = document.getElementById("terminal-cursor");
  const title = document.querySelector("h1");
  const inputs = document.querySelectorAll("input");

  inputs.forEach(input => {
    input.addEventListener("focus", () => {
      input.after(cursor);
    });

    input.addEventListener("blur", () => {
      title.appendChild(cursor);
    });
  });
</script>
